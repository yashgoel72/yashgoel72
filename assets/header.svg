<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Yash Goel — AI engineer at Microsoft, building MeeShip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1b1147"/>
      <stop offset="1" stop-color="#3a0d4f"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="c"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <!-- floating blocks -->
    <g fill="none" stroke="url(#ac)" stroke-width="2">
      <rect x="720" y="40" width="46" height="46" rx="8">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="790" y="110" width="46" height="46" rx="8">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="700" y="160" width="46" height="46" rx="8">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
      </rect>
      <path d="M766 63L790 120M790 150L746 170" stroke-dasharray="4 5">
        <animate attributeName="stroke-dashoffset" values="0;-36" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="50" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Hi, I'm</text>
    <text x="50" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#ac)">Yash Goel</text>
    <text font-family="Consolas, Menlo, monospace" font-size="20" fill="#e2e8f0" x="50" y="205">
      <tspan>AI engineer · builder · e-commerce tools for sellers</tspan>
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <rect x="50" y="222" width="260" height="4" rx="2" fill="url(#ac)">
      <animate attributeName="width" values="0;260;120;260" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
